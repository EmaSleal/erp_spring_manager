version: '3.8'

services:
  # Base de datos MySQL
  mysql:
    image: mysql:8.0.32
    container_name: whats_orders_mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: facturas_monrachem
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network
    # NO exponemos puerto al host (solo accesible internamente)
    command: --authentication_policy=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-ppassword"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s

  # Aplicación Spring Boot
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whats_orders_app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # Configuración de Base de Datos (apunta al contenedor MySQL)
      DB_URL: jdbc:mysql://mysql:3306/facturas_monrachem?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: password
      
      # Configuración de Email (mantener las del application.yml)
      EMAIL_HOST: smtp.gmail.com
      EMAIL_PORT: 587
      EMAIL_USERNAME: EMAIL_PLACEHOLDER
      EMAIL_PASSWORD: "REDACTED"
      
      # Configuración de WhatsApp (ajustar según necesidad)
      WHATSAPP_API_URL: ${WHATSAPP_API_URL:-https://graph.facebook.com/v17.0}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      
      # URL pública (usada en links de WhatsApp y redirects)
      APP_BASE_URL: https://erp-spring-dev.astro-solutions.net
      # Configuración de Java
      JAVA_OPTS: "-Xmx1024m -Xms512m"
      SPRING_PROFILES_ACTIVE: prod
    ports:
      # Puerto externo 9090 -> Puerto interno 9090
      - "9090:9090"
    networks:
      - app-network
    volumes:
      - app_logs:/app/logs
      - certificados_data:/app/certificados
      - comprobantes_data:/app/comprobantes
      - sellos_data:/app/sellos
      - uploads_data:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s

  seed:
    image: mysql:8.0.32
    container_name: whats_orders_seed
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./database/seeds:/seeds:ro
      - ./database/routines:/routines:ro
    environment:
      MYSQL_PWD: password
    networks:
      - app-network
    command: >
      bash -c "
        echo 'Starting seed...';
        for f in /seeds/*.sql; do
          echo \"Running $$f\";
          mysql -h mysql -u root facturas_monrachem < $$f || exit 1;
        done;
        echo 'Seeding complete.';
        for f in /routines/*.sql; do
          [ -e \"$$f\" ] || continue;
          echo \"Applying routine $$f\";
          sed 's/DEFINER=[^ ]*//g' \"$$f\" | mysql -h mysql -u root facturas_monrachem || exit 1;
        done;
        echo 'Routines applied.'
      "
    restart: "no"

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  app_logs:
    driver: local
  certificados_data:
    driver: local
  comprobantes_data:
    driver: local
  sellos_data:
    driver: local
  uploads_data:
    driver: local
