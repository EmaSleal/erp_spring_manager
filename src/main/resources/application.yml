# spring port, configurable via SERVER_PORT (.env), default 15808
server:
    port: ${SERVER_PORT:15808}

spring:
  config:
    import: optional:file:.env[.properties]
  mvc:
    hiddenmethod:
      filter:
        enabled: true

  main:
    allow-bean-definition-overriding: true
    web-application-type: servlet
  
  # ========================================
  # CONFIGURACIÓN DE BASE DE DATOS
  # ========================================
  # Sin valores por defecto (T-021): si falta DB_URL, DB_USERNAME o DB_PASSWORD la aplicación no arranca
  # y lo indica (RequiredConfigurationEnvironmentPostProcessor). DB_PASSWORD puede ser vacía, pero debe existir.
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false
  
  # ========================================
  # CONFIGURACIÓN DE EMAIL
  # ========================================
  mail:
    host: ${EMAIL_HOST:smtp.gmail.com}
    port: ${EMAIL_PORT:587}
    username: ${EMAIL_USERNAME:}
    password: ${EMAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: ${EMAIL_HOST:smtp.gmail.com}
        debug: false
    default-encoding: UTF-8

# ========================================
# CONFIGURACIÓN DE WHATSAPP WEBHOOK
# ========================================
meta:
  webhook:
    # Obligatorio, sin valor por defecto (T-021)
    verify-token: ${META_WEBHOOK_VERIFY_TOKEN}

# ========================================
# CIFRADO DE CREDENCIALES DE HACIENDA (T-021)
# ========================================
# Base64 de 32 bytes (openssl rand -base64 32). Puede faltar solo si configuracion_hacienda está vacía.
# Respaldar aparte de la base: sin esta clave las credenciales cifradas no se pueden recuperar.
hacienda:
  crypto:
    key: ${HACIENDA_CRYPTO_KEY:}

# ========================================
# CONFIGURACIÓN DE WHATSAPP API
# ========================================
whatsapp:
  api:
    url: ${META_WHATSAPP_API_URL:https://graph.facebook.com}
    version: ${META_WHATSAPP_API_VERSION:v18.0}
  phone-number-id: ${META_WHATSAPP_PHONE_NUMBER_ID:}
  access-token: ${META_WHATSAPP_ACCESS_TOKEN:}

# ========================================
# CONFIGURACIÓN DE BASE URL
# ========================================
smtp:
  encryption:
    key: ${SMTP_ENCRYPTION_KEY:}

app:
  base-url: ${APP_BASE_URL:http://localhost:15808}
  certificados:
    directorio: ${CERTIFICADOS_DIR:/app/certificados}
  sellos:
    directorio: ${SELLOS_DIR:/app/sellos}
  uploads:
    directorio: ${UPLOADS_DIR:/app/uploads}

# ========================================
# CONFIGURACIÓN DE FACTURACIÓN ELECTRÓNICA
# ========================================
facturacion:
  comprobantes:
    directorio-base: ${FACTURACION_DIRECTORIO_BASE:./comprobantes}
  
  hacienda:
    webhook:
      # Token de seguridad para validar callbacks de Hacienda
      # Si está vacío, no se valida el token
      token: ${HACIENDA_WEBHOOK_TOKEN:}
      
      # URL pública del webhook (para registrar en Hacienda)
      # Esta URL debe ser accesible desde internet
      url: ${HACIENDA_WEBHOOK_URL:https://tu-dominio.com/api/hacienda/callback}

# ========================================
# TIPO DE CAMBIO - SINCRONIZACIÓN DIARIA (T-008)
# ========================================
tipo-cambio:
  sync:
    # Job diario que guarda el tipo de cambio del día con fuente API_EXTERNA
    enabled: ${TIPO_CAMBIO_SYNC_ENABLED:true}
    # Todos los días a las 06:15 (hora de Costa Rica)
    cron: "${TIPO_CAMBIO_SYNC_CRON:0 15 6 * * *}"
    zone: ${TIPO_CAMBIO_SYNC_ZONE:America/Costa_Rica}
    # Monedas separadas por coma. EUR usa /indicadores/tc/euro ({fecha, dolares, colones}; fecha de la última publicación).
    monedas: ${TIPO_CAMBIO_SYNC_MONEDAS:USD}
  hacienda:
    # API pública sin credenciales: {url-base}/dolar y {url-base}/euro
    url-base: ${TIPO_CAMBIO_HACIENDA_URL:https://api.hacienda.go.cr/indicadores/tc}
    timeout-segundos: ${TIPO_CAMBIO_HACIENDA_TIMEOUT:10}

# ========================================
# RESILIENCE4J - CIRCUIT BREAKER Y RETRY
# ========================================
resilience4j:
  circuitbreaker:
    instances:
      haciendaAPI:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        slowCallDurationThreshold: 5000
        slowCallRateThreshold: 50
  
  retry:
    instances:
      haciendaAPI:
        maxAttempts: 3
        waitDuration: 2000
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - org.springframework.web.client.HttpServerErrorException
          - org.springframework.web.client.ResourceAccessException
          - java.net.ConnectException
          - java.net.SocketTimeoutException

# ========================================
# CONFIGURACIÓN DE LOGGING
# ========================================
logging:
  level:
    root: INFO
    
    # Paquetes de la aplicación
    api.astro.whats_orders_manager: INFO
    api.astro.whats_orders_manager.controllers: INFO
    api.astro.whats_orders_manager.services: INFO
    api.astro.whats_orders_manager.repositories: INFO
    
    # Hibernate SQL (queries) - DESACTIVADO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    org.hibernate.orm.jdbc.bind: WARN
    
    # Spring Framework
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.springframework.web.servlet.mvc.method.annotation: INFO
    
    # Transacciones de base de datos - DESACTIVADO
    org.springframework.jdbc.core: WARN
    org.springframework.transaction: INFO
    
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  
  # Configuración de archivos de log (opcional)
  file:
    name: logs/whats-orders-manager.log
    max-size: 10MB
    max-history: 30
    total-size-cap: 1GB

# ========================================
# PROFILES - Configuración por ambiente
# ========================================
---
spring:
  config:
    activate:
      on-profile: dev

logging:
  level:
    root: DEBUG
    api.astro.whats_orders_manager: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

---
spring:
  config:
    import: optional:file:.env[.properties]
    activate:
      on-profile: prod

server:
  forward-headers-strategy: native

logging:
  level:
    root: WARN
    api.astro.whats_orders_manager: INFO
    api.astro.whats_orders_manager.controllers: INFO
    org.hibernate.SQL: WARN

  file:
    name: /app/logs/application.log

management:
  health:
    mail:
      enabled: false
