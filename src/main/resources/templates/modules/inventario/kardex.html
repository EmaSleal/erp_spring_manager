<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="es">
<head th:replace="~{shared/layout :: head}">
    <title>Kardex de Inventario</title>
</head>
<body>
    <div th:replace="~{shared/components/navbar :: navbar}"></div>
    <div th:replace="~{shared/components/sidebar :: sidebar}"></div>

    <main class="main-content module-inventario-scope">
        <div class="container-fluid py-4">

            <div th:replace="~{shared/fragments/page-header :: breadcrumb('fas fa-list-alt', 'Kardex de Inventario')}"></div>

            <div class="page-header mb-4">
                <div th:replace="~{shared/fragments/page-header :: pageHeaderContent('fas fa-list-alt', 'text-module-inventario', 'Kardex de', 'Inventario', 'Movimientos detallados por producto')}"></div>
                <div class="page-header-actions">
                    <a th:replace="~{shared/fragments/back-button :: backButton('/dashboard', 'Volver', 'Volver al Dashboard')}"></a>
                </div>
            </div>

            <!-- Product selector -->
            <div class="card shadow-sm border-0 mb-4">
                <div class="card-body">
                    <div class="row g-3 align-items-end">
                        <div class="col-md-8">
                            <label for="selectProducto" class="form-label fw-semibold">Producto</label>
                            <select id="selectProducto" class="form-select">
                                <option value="">-- Seleccioná un producto --</option>
                                <option th:each="p : ${productos}"
                                        th:value="${p.idProducto}"
                                        th:text="${p.descripcion}">Producto</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <button id="btnVerKardex" class="btn btn-module-inventario w-100" onclick="cargarKardex()">
                                <i class="fas fa-search me-2"></i>Ver Kardex
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Kardex table -->
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <div id="kardexEmpty" class="text-center py-5 text-muted">
                        <i class="fas fa-list-alt fa-3x mb-3 opacity-25"></i>
                        <p>Seleccioná un producto o hacé clic en "Ver Kardex" para ver todos los movimientos.</p>
                    </div>
                    <div id="kardexLoading" class="text-center py-5 d-none">
                        <div class="spinner-border text-info" role="status"></div>
                    </div>
                    <div id="kardexTableWrapper" class="table-responsive d-none">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>Fecha</th>
                                    <th>Tipo</th>
                                    <th class="text-end">Cantidad</th>
                                    <th class="text-end">Costo Unit.</th>
                                    <th class="text-end">Costo Total</th>
                                    <th class="text-end">Stock Ant.</th>
                                    <th class="text-end">Stock Nuevo</th>
                                    <th>Documento</th>
                                </tr>
                            </thead>
                            <tbody id="kardexBody"></tbody>
                        </table>
                    </div>
                    <div id="kardexNoData" class="text-center py-5 text-muted d-none">
                        <i class="fas fa-inbox fa-3x mb-3 opacity-25"></i>
                        <p>Este producto no tiene movimientos registrados.</p>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <script>
        function cargarKardex() {
            const id = document.getElementById('selectProducto').value;
            const url = id ? `/api/inventario/kardex/${id}` : '/api/inventario/kardex';

            const empty = document.getElementById('kardexEmpty');
            const loading = document.getElementById('kardexLoading');
            const wrapper = document.getElementById('kardexTableWrapper');
            const noData = document.getElementById('kardexNoData');
            const body = document.getElementById('kardexBody');

            empty.classList.add('d-none');
            noData.classList.add('d-none');
            wrapper.classList.add('d-none');
            loading.classList.remove('d-none');

            fetch(url)
                .then(r => r.ok ? r.json() : Promise.reject(r.status))
                .then(items => {
                    loading.classList.add('d-none');
                    if (!items.length) { noData.classList.remove('d-none'); return; }
                    body.innerHTML = items.map(m => `
                        <tr>
                            <td>${new Date(m.fecha).toLocaleString('es-CR')}</td>
                            <td><span class="badge ${m.cantidad > 0 ? 'badge-secondary' : 'badge-outline-secondary'}">${m.tipo}</span></td>
                            <td class="text-end">${m.cantidad}</td>
                            <td class="text-end">${m.costoUnitario != null ? '₡' + m.costoUnitario.toLocaleString('es-CR') : '—'}</td>
                            <td class="text-end">${m.costoTotal != null ? '₡' + m.costoTotal.toLocaleString('es-CR') : '—'}</td>
                            <td class="text-end">${m.stockAnterior}</td>
                            <td class="text-end fw-semibold">${m.stockNuevo}</td>
                            <td class="text-muted small">${m.documentoOrigen ?? '—'}</td>
                        </tr>`).join('');
                    wrapper.classList.remove('d-none');
                })
                .catch(() => {
                    loading.classList.add('d-none');
                    noData.classList.remove('d-none');
                });
        }

        document.getElementById('selectProducto').addEventListener('change', cargarKardex);
    </script>
</body>
</html>
