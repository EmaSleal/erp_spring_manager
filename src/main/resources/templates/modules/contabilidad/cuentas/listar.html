<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" 
      lang="es">
<head th:replace="~{shared/layout :: head}">
    <title>Plan de Cuentas</title>
</head>
<body>
    <!-- Navbar -->
    <div th:replace="~{shared/components/navbar :: navbar}"></div>

    <!-- Sidebar -->
    <div th:replace="~{shared/components/sidebar :: sidebar}"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container-fluid py-4">
            <!-- Breadcrumbs -->
            <nav aria-label="breadcrumb" class="mb-3">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item">
                        <a th:href="@{/dashboard}" class="text-decoration-none">
                            <i class="fas fa-home me-1"></i>Dashboard
                        </a>
                    </li>
                    <li class="breadcrumb-item">
                        <a th:href="@{/contabilidad}" class="text-decoration-none">
                            <i class="fas fa-calculator me-1"></i>Contabilidad
                        </a>
                    </li>
                    <li class="breadcrumb-item active" aria-current="page">
                        <i class="fas fa-list-alt me-1"></i>Plan de Cuentas
                    </li>
                </ol>
            </nav>

            <!-- Header Section -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="h3 mb-1"><i class="fas fa-list-alt text-info me-2"></i>Plan de Cuentas Contables</h2>
                    <p class="text-muted mb-0">Gestión del catálogo de cuentas contables</p>
                </div>
                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-outline-secondary" onclick="expandirTodo()">
                        <i class="fas fa-expand-alt me-2"></i>Expandir Todo
                    </button>
                    <button type="button" class="btn btn-outline-secondary" onclick="colapsarTodo()">
                        <i class="fas fa-compress-alt me-2"></i>Colapsar Todo
                    </button>
                    <a th:href="@{/contabilidad/cuentas/crear}" class="btn btn-primary" 
                       sec:authorize="@permisoService.tienePermisoPorCodigo(#authentication.name, '')">
                        <i class="fas fa-plus me-2"></i>Nueva Cuenta
                    </a>
                </div>
            </div>

            <!-- Filters Section -->
            <div th:replace="~{shared/fragments/filter-bar :: filterCard(~{::.filter-row}, 'mb-4')}">
                <div class="filter-row row g-3">
                    <div class="col-md-4">
                        <label class="form-label small text-muted">Buscar por código o nombre</label>
                        <input type="text" id="txtBuscar" class="form-control"
                               placeholder="Escriba para buscar...">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small text-muted">Tipo de cuenta</label>
                        <select id="selTipo" class="form-select">
                            <option value="">Todos los tipos</option>
                            <option value="ACTIVO">Activo</option>
                            <option value="PASIVO">Pasivo</option>
                            <option value="CAPITAL">Capital</option>
                            <option value="INGRESO">Ingreso</option>
                            <option value="EGRESO">Egreso</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small text-muted">Estado</label>
                        <select id="selEstado" class="form-select">
                            <option value="">Todas</option>
                            <option value="true" selected>Activas</option>
                            <option value="false">Inactivas</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small text-muted">&nbsp;</label>
                        <button type="button" class="btn btn-info w-100" onclick="aplicarFiltros()">
                            <i class="fas fa-filter me-2"></i>Filtrar
                        </button>
                    </div>
                </div>
            </div>

            <!-- Accounts Tree -->
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white py-3">
                    <h5 class="mb-0"><i class="fas fa-sitemap me-2 text-primary"></i>Estructura Jerárquica</h5>
                </div>
                <div class="card-body">
                    <!-- Loading State -->
                    <div id="loadingCuentas" class="text-center py-5">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Cargando...</span>
                        </div>
                        <p class="text-muted mt-2">Cargando plan de cuentas...</p>
                    </div>

                    <!-- Empty State -->
                    <div id="emptyCuentas" class="text-center py-5 d-none">
                        <i class="fas fa-folder-open fa-4x text-muted mb-3"></i>
                        <h5 class="text-muted">No hay cuentas registradas</h5>
                        <p class="text-muted">Comience creando una cuenta raíz</p>
                        <a th:href="@{/contabilidad/cuentas/crear}" class="btn btn-primary"
                           sec:authorize="@permisoService.tienePermisoPorCodigo(#authentication.name, '')">
                            <i class="fas fa-plus me-2"></i>Crear Primera Cuenta
                        </a>
                    </div>

                    <!-- Accounts Tree Container -->
                    <div id="treeCuentas" class="d-none">
                        <!-- Will be populated by JavaScript -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Scripts base -->
    <th:block th:replace="~{shared/layout :: scripts}"></th:block>
    
    <!-- JavaScript específico de página -->
    <script th:src="@{/modules/contabilidad/js/cuentas.js}"></script>
</body>
</html>
