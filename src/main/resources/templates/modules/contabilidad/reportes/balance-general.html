<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" 
      lang="es">
<head th:replace="~{shared/layout :: head}">
    <title>Balance General</title>
</head>
<body>
    <div th:replace="~{shared/components/navbar :: navbar}"></div>
    <div th:replace="~{shared/components/sidebar :: sidebar}"></div>
    
    <main class="main-content module-contabilidad-scope">
        <div class="container-fluid py-4">
            <nav aria-label="breadcrumb" class="mb-3">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/dashboard}"><i class="fas fa-home"></i> Dashboard</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/contabilidad}">Contabilidad</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/contabilidad/reportes}">Reportes</a></li>
                    <li class="breadcrumb-item active">Balance General</li>
                </ol>
            </nav>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="h3 mb-1"><i class="fas fa-chart-pie text-module-contabilidad"></i> Balance General</h1>
                    <p class="text-muted">Al <span th:text="${#temporals.format(fecha, 'dd/MM/yyyy')}"></span></p>
                </div>
                <div>
                    <button type="button" class="btn btn-outline-secondary me-2" onclick="window.location.href='/contabilidad/reportes'">
                        <i class="fas fa-arrow-left"></i> Volver
                    </button>
                    <button type="button" class="btn btn-outline-secondary" onclick="exportarPDF()">
                        <i class="fas fa-file-pdf"></i> Exportar PDF
                    </button>
                </div>
            </div>

            <div class="row">
                <!-- Activos -->
                <div class="col-md-6">
                    <div class="card border-0 shadow-sm mb-4">
                        <div class="card-header bg-light border-bottom">
                            <h5 class="mb-0">ACTIVOS</h5>
                        </div>
                        <div class="card-body">
                            <table class="table table-sm">
                                <tr th:each="cuenta : ${balance.activos}">
                                    <td th:text="${cuenta.cuenta.codigo}">1.1</td>
                                    <td th:text="${cuenta.cuenta.nombre}">Cuenta</td>
                                    <td class="text-end fw-semibold" th:text="'$' + ${#numbers.formatDecimal(cuenta.saldo, 1, 'COMMA', 2, 'POINT')}">$0.00</td>
                                </tr>
                            </table>
                            <div class="border-top pt-2 mt-2">
                                <div class="d-flex justify-content-between fw-bold">
                                    <span>Total Activos:</span>
                                    <span th:text="'$' + ${#numbers.formatDecimal(balance.totalActivos, 1, 'COMMA', 2, 'POINT')}">$0.00</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Pasivos y Patrimonio -->
                <div class="col-md-6">
                    <!-- Pasivos -->
                    <div class="card border-0 shadow-sm mb-4">
                        <div class="card-header bg-light border-bottom">
                            <h5 class="mb-0">PASIVOS</h5>
                        </div>
                        <div class="card-body">
                            <table class="table table-sm">
                                <tr th:each="cuenta : ${balance.pasivos}">
                                    <td th:text="${cuenta.cuenta.codigo}">2.1</td>
                                    <td th:text="${cuenta.cuenta.nombre}">Cuenta</td>
                                    <td class="text-end fw-semibold" th:text="'$' + ${#numbers.formatDecimal(cuenta.saldo, 1, 'COMMA', 2, 'POINT')}">$0.00</td>
                                </tr>
                            </table>
                            <div class="border-top pt-2 mt-2">
                                <div class="d-flex justify-content-between fw-bold">
                                    <span>Total Pasivos:</span>
                                    <span th:text="'$' + ${#numbers.formatDecimal(balance.totalPasivos, 1, 'COMMA', 2, 'POINT')}">$0.00</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Patrimonio -->
                    <div class="card border-0 shadow-sm mb-4">
                        <div class="card-header bg-light border-bottom">
                            <h5 class="mb-0">PATRIMONIO</h5>
                        </div>
                        <div class="card-body">
                            <table class="table table-sm">
                                <tr th:each="cuenta : ${balance.capital}">
                                    <td th:text="${cuenta.cuenta.codigo}">3.1</td>
                                    <td th:text="${cuenta.cuenta.nombre}">Cuenta</td>
                                    <td class="text-end fw-semibold" th:text="'$' + ${#numbers.formatDecimal(cuenta.saldo, 1, 'COMMA', 2, 'POINT')}">$0.00</td>
                                </tr>
                            </table>
                            <div class="border-top pt-2 mt-2">
                                <div class="d-flex justify-content-between fw-bold">
                                    <span>Total Patrimonio:</span>
                                    <span th:text="'$' + ${#numbers.formatDecimal(balance.totalCapital, 1, 'COMMA', 2, 'POINT')}">$0.00</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Ecuación Contable -->
                <div class="col-md-12">
                    <div class="alert alert-info">
                        <div class="d-flex justify-content-around align-items-center">
                            <div class="text-center">
                                <strong>ACTIVOS</strong>
                                <div class="fs-4 fw-bold" th:text="'$' + ${#numbers.formatDecimal(balance.totalActivos, 1, 'COMMA', 2, 'POINT')}">$0.00</div>
                            </div>
                            <div class="fs-3">=</div>
                            <div class="text-center">
                                <strong>PASIVOS</strong>
                                <div class="fs-4 fw-bold" th:text="'$' + ${#numbers.formatDecimal(balance.totalPasivos, 1, 'COMMA', 2, 'POINT')}">$0.00</div>
                            </div>
                            <div class="fs-3">+</div>
                            <div class="text-center">
                                <strong>PATRIMONIO</strong>
                                <div class="fs-4 fw-bold" th:text="'$' + ${#numbers.formatDecimal(balance.totalCapital, 1, 'COMMA', 2, 'POINT')}">$0.00</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    
    <th:block th:replace="~{shared/layout :: scripts}"></th:block>
    <script th:src="@{/modules/contabilidad/js/reportes.js}"></script>
</body>
</html>
