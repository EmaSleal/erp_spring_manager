<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" 
      lang="es">
<head th:replace="~{shared/layout :: head}">
    <title>Libro Mayor</title>
</head>
<body>
    <div th:replace="~{shared/components/navbar :: navbar}"></div>
    <div th:replace="~{shared/components/sidebar :: sidebar}"></div>
    
    <main class="main-content">
        <div class="container-fluid py-4">
            <nav aria-label="breadcrumb" class="mb-3">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/dashboard}"><i class="fas fa-home"></i> Dashboard</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/contabilidad}">Contabilidad</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/contabilidad/reportes}">Reportes</a></li>
                    <li class="breadcrumb-item active">Libro Mayor</li>
                </ol>
            </nav>
            
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="h3 mb-1"><i class="fas fa-book text-primary"></i> Libro Mayor</h1>
                    <p class="text-muted">Movimientos contables de la cuenta seleccionada</p>
                </div>
                <div>
                    <button type="button" class="btn btn-outline-secondary me-2" onclick="window.location.href='/contabilidad/reportes'">
                        <i class="fas fa-arrow-left"></i> Volver
                    </button>
                    <button type="button" class="btn btn-success" onclick="exportarPDF()">
                        <i class="fas fa-file-pdf"></i> Exportar PDF
                    </button>
                </div>
            </div>
            
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-body">
                    <div class="row align-items-end g-3">
                        <div class="col-md-4">
                            <label for="selCuenta" class="form-label">Cuenta Contable</label>
                            <select class="form-select" id="selCuenta" onchange="cambiarCuenta()">
                                <option value="">Seleccione una cuenta...</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label for="dtFechaInicio" class="form-label">Fecha Inicio</label>
                            <input type="date" class="form-control" id="dtFechaInicio" th:value="${fechaInicio}">
                        </div>
                        <div class="col-md-3">
                            <label for="dtFechaFin" class="form-label">Fecha Fin</label>
                            <input type="date" class="form-control" id="dtFechaFin" th:value="${fechaFin}">
                        </div>
                        <div class="col-md-2">
                            <button type="button" class="btn btn-primary w-100" onclick="generarReporte()">
                                <i class="fas fa-search"></i> Consultar
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            
            <div th:if="${movimientos != null}" class="card border-0 shadow-sm">
                <div class="card-header bg-white">
                    <h5 class="mb-0">Movimientos del <span th:text="${#temporals.format(fechaInicio, 'dd/MM/yyyy')}"></span> al <span th:text="${#temporals.format(fechaFin, 'dd/MM/yyyy')}"></span></h5>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-sm table-hover">
                            <thead class="table-light">
                                <tr>
                                    <th>Fecha</th>
                                    <th>Asiento</th>
                                    <th>Concepto</th>
                                    <th class="text-end">Debe</th>
                                    <th class="text-end">Haber</th>
                                    <th class="text-end">Saldo</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="mov : ${movimientos}">
                                    <td th:text="${#temporals.format(mov.fecha, 'dd/MM/yyyy')}">01/01/2024</td>
                                    <td><code th:text="${mov.asientoNumero}">ASI-001</code></td>
                                    <td th:text="${mov.descripcion}">Concepto</td>
                                    <td class="text-end text-primary" th:text="'$' + ${#numbers.formatDecimal(mov.debe, 1, 'COMMA', 2, 'POINT')}">$0.00</td>
                                    <td class="text-end text-success" th:text="'$' + ${#numbers.formatDecimal(mov.haber, 1, 'COMMA', 2, 'POINT')}">$0.00</td>
                                    <td class="text-end fw-bold" th:text="'$' + ${#numbers.formatDecimal(mov.saldo, 1, 'COMMA', 2, 'POINT')}">$0.00</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>
    
    <th:block th:replace="~{shared/layout :: scripts}"></th:block>
    <script th:src="@{/modules/contabilidad/js/reportes.js}"></script>
</body>
</html>
