<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" 
      lang="es">
<head th:replace="~{shared/layout :: head}">
    <title>Estado de Resultados</title>
</head>
<body>
    <div th:replace="~{shared/components/navbar :: navbar}"></div>
    <div th:replace="~{shared/components/sidebar :: sidebar}"></div>
    
    <main class="main-content module-contabilidad-scope">
        <div class="container-fluid py-4">
            <nav aria-label="breadcrumb" class="mb-3">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/dashboard}"><i class="fas fa-home"></i> Dashboard</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/contabilidad}">Contabilidad</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/contabilidad/reportes}">Reportes</a></li>
                    <li class="breadcrumb-item active">Estado de Resultados</li>
                </ol>
            </nav>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="h3 mb-1"><i class="fas fa-chart-line text-module-contabilidad"></i> Estado de Resultados</h1>
                    <p class="text-muted">Del <span th:text="${#temporals.format(fechaInicio, 'dd/MM/yyyy')}"></span> al <span th:text="${#temporals.format(fechaFin, 'dd/MM/yyyy')}"></span></p>
                </div>
                <div>
                    <button type="button" class="btn btn-outline-secondary me-2" onclick="window.location.href='/contabilidad/reportes'">
                        <i class="fas fa-arrow-left"></i> Volver
                    </button>
                    <button type="button" class="btn btn-outline-secondary" onclick="exportarPDF()">
                        <i class="fas fa-file-pdf"></i> Exportar PDF
                    </button>
                </div>
            </div>

            <div class="row">
                <div class="col-md-8 offset-md-2">
                    <!-- Ingresos -->
                    <div class="card border-0 shadow-sm mb-4">
                        <div class="card-header bg-light border-bottom">
                            <h5 class="mb-0">INGRESOS</h5>
                        </div>
                        <div class="card-body">
                            <table class="table table-sm">
                                <tr th:each="cuenta : ${estado.ingresos}">
                                    <td th:text="${cuenta.cuenta.codigo}">4.1</td>
                                    <td th:text="${cuenta.cuenta.nombre}">Cuenta</td>
                                    <td class="text-end fw-semibold" th:text="'$' + ${#numbers.formatDecimal(cuenta.saldo, 1, 'COMMA', 2, 'POINT')}">$0.00</td>
                                </tr>
                            </table>
                            <div class="border-top pt-2 mt-2">
                                <div class="d-flex justify-content-between fw-bold">
                                    <span>Total Ingresos:</span>
                                    <span th:text="'$' + ${#numbers.formatDecimal(estado.totalIngresos, 1, 'COMMA', 2, 'POINT')}">$0.00</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Egresos -->
                    <div class="card border-0 shadow-sm mb-4">
                        <div class="card-header bg-light border-bottom">
                            <h5 class="mb-0">EGRESOS</h5>
                        </div>
                        <div class="card-body">
                            <table class="table table-sm">
                                <tr th:each="cuenta : ${estado.egresos}">
                                    <td th:text="${cuenta.cuenta.codigo}">5.1</td>
                                    <td th:text="${cuenta.cuenta.nombre}">Cuenta</td>
                                    <td class="text-end fw-semibold" th:text="'$' + ${#numbers.formatDecimal(cuenta.saldo, 1, 'COMMA', 2, 'POINT')}">$0.00</td>
                                </tr>
                            </table>
                            <div class="border-top pt-2 mt-2">
                                <div class="d-flex justify-content-between fw-bold">
                                    <span>Total Egresos:</span>
                                    <span th:text="'$' + ${#numbers.formatDecimal(estado.totalEgresos, 1, 'COMMA', 2, 'POINT')}">$0.00</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Utilidad Neta -->
                    <div th:classappend="${estado.totalIngresos - estado.totalEgresos >= 0 ? 'alert-success' : 'alert-danger'}" class="alert">
                        <div class="d-flex justify-content-between align-items-center">
                            <h4 class="mb-0">
                                <i th:class="${estado.totalIngresos - estado.totalEgresos >= 0 ? 'fas fa-arrow-up' : 'fas fa-arrow-down'}"></i>
                                <span th:text="${estado.totalIngresos - estado.totalEgresos >= 0 ? 'UTILIDAD NETA' : 'PÉRDIDA NETA'}">UTILIDAD NETA</span>
                            </h4>
                            <h3 class="mb-0 fw-bold" th:text="'$' + ${#numbers.formatDecimal(estado.totalIngresos - estado.totalEgresos, 1, 'COMMA', 2, 'POINT')}">$0.00</h3>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    
    <th:block th:replace="~{shared/layout :: scripts}"></th:block>
    <script th:src="@{/modules/contabilidad/js/reportes.js}"></script>
</body>
</html>
