<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="es">
<head th:replace="~{shared/layout :: head}">
    <title>Contabilidad</title>
</head>
<body>
    <!-- CSS de dashboard (reutilizamos los estilos de módulos) -->
    <link rel="stylesheet" th:href="@{/modules/presentacion/css/dashboard.css}">
    
    <!-- Navbar -->
    <div th:replace="~{shared/components/navbar :: navbar}"></div>
    
    <!-- Sidebar -->
    <div th:replace="~{shared/components/sidebar :: sidebar}"></div>
    
    <!-- Contenido principal -->
    <main class="main-content">
        <div class="container-fluid py-4">
            <!-- Breadcrumb -->
            <div th:replace="~{shared/fragments/page-header :: breadcrumb('fas fa-calculator', 'Contabilidad')}"></div>

            <!-- Encabezado -->
            <div th:replace="~{shared/fragments/page-header :: pageHeader('fas fa-calculator', 'text-danger', 'Módulo de', 'Contabilidad', 'Gestión contable y financiera del sistema', '/dashboard', 'Dashboard')}"></div>
            
            <!-- Submódulos Disponibles -->
            <div class="row mb-4">
                <div class="col-12">
                    <h4 class="mb-3">
                        <i class="fas fa-th me-2"></i>
                        Submódulos Disponibles
                    </h4>
                    <p class="text-muted">Accede rápidamente a las funcionalidades de contabilidad</p>
                </div>
            </div>
            
            <!-- Grid de Módulos (componente reutilizable) -->
            <div th:replace="~{shared/components/modules-grid :: modulesGrid(modulos=${modulos})}"></div>
            
        </div>
    </main>
    
    <!-- Scripts base -->
    <div th:replace="~{shared/layout :: scripts}"></div>
    
    <!-- Script para manejo de clicks en módulos -->
    <script>
        function handleModuleClick(element) {
            const activo = element.dataset.activo === 'true';
            const ruta = element.dataset.ruta;
            const nombre = element.dataset.nombre;
            
            if (activo) {
                // Redirigir al módulo
                window.location.href = ruta;
            } else {
                // Mostrar mensaje de próximamente
                Swal.fire({
                    icon: 'info',
                    title: 'Próximamente',
                    text: `El módulo "${nombre}" estará disponible pronto.`,
                    confirmButtonText: 'Entendido',
                    confirmButtonColor: '#3085d6'
                });
            }
        }
    </script>
</body>
</html>
