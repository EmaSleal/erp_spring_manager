<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" 
      lang="es">
<head th:replace="~{shared/layout :: head}">
    <title>Asientos Contables</title>
</head>
<body>
    <!-- Navbar -->
    <div th:replace="~{shared/components/navbar :: navbar}"></div>
    
    <!-- Sidebar -->
    <div th:replace="~{shared/components/sidebar :: sidebar}"></div>
    
    <!-- Main Content -->
    <main class="main-content module-contabilidad-scope">
        <div class="container-fluid py-4">
            <!-- Breadcrumb -->
            <nav aria-label="breadcrumb" class="mb-3">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a th:href="@{/dashboard}"><i class="fas fa-home"></i> Dashboard</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/contabilidad}">Contabilidad</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Asientos Contables</li>
                </ol>
            </nav>

            <!-- Header -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="h3 mb-1"><i class="fas fa-book text-module-contabilidad"></i> Asientos Contables</h1>
                    <p class="text-muted">Registro de asientos contables del sistema</p>
                </div>
                <div>
                    <button type="button" class="btn btn-module-contabilidad"
                            onclick="window.location.href='/contabilidad/asientos/crear'"
                            sec:authorize="@permisoService.tienePermisoPorCodigo(#authentication.name, 'CONTABILIDAD_CREAR')">
                        <i class="fas fa-plus"></i> Nuevo Asiento
                    </button>
                </div>
            </div>
            
            <!-- Filtros -->
            <div th:replace="~{shared/fragments/filter-bar :: filterCard(~{::.filter-row}, 'mb-4')}">
                <div class="filter-row row g-3">
                    <div class="col-md-3">
                        <label for="txtBuscar" class="form-label">Buscar</label>
                        <input type="text" class="form-control" id="txtBuscar"
                               placeholder="Número o concepto...">
                    </div>
                    <div class="col-md-2">
                        <label for="selTipo" class="form-label">Tipo</label>
                        <select class="form-select" id="selTipo">
                            <option value="">Todos los tipos</option>
                            <option value="MANUAL">Manual</option>
                            <option value="AUTOMATICO_FACTURA">Automático - Factura</option>
                            <option value="AUTOMATICO_PAGO">Automático - Pago</option>
                            <option value="AJUSTE">Ajuste</option>
                            <option value="CIERRE">Cierre</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label for="selEstado" class="form-label">Estado</label>
                        <select class="form-select" id="selEstado">
                            <option value="">Todos los estados</option>
                            <option value="BORRADOR">Borrador</option>
                            <option value="CONTABILIZADO">Contabilizado</option>
                            <option value="ANULADO">Anulado</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label for="dtFechaInicio" class="form-label">Fecha Inicio</label>
                        <input type="date" class="form-control" id="dtFechaInicio">
                    </div>
                    <div class="col-md-2">
                        <label for="dtFechaFin" class="form-label">Fecha Fin</label>
                        <input type="date" class="form-control" id="dtFechaFin">
                    </div>
                    <div class="col-md-1 d-flex align-items-end">
                        <button type="button" class="btn btn-outline-secondary w-100" onclick="aplicarFiltros()">
                            <i class="fas fa-filter"></i> Filtrar
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- Tabla de Asientos -->
            <div class="card border-0 shadow-sm">
                <div class="card-body">
                    <!-- Loading -->
                    <div id="loadingAsientos" class="text-center py-5" style="display: none;">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Cargando...</span>
                        </div>
                        <p class="mt-2 text-muted">Cargando asientos...</p>
                    </div>
                    
                    <!-- Empty State -->
                    <div id="emptyAsientos" class="text-center py-5" style="display: none;">
                        <i class="fas fa-book fa-3x text-muted mb-3"></i>
                        <p class="text-muted">No se encontraron asientos contables</p>
                    </div>
                    
                    <!-- Tabla -->
                    <div id="tablaAsientos" style="display: none;">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th>Número</th>
                                        <th>Fecha</th>
                                        <th>Tipo</th>
                                        <th>Concepto</th>
                                        <th class="text-end">Debe</th>
                                        <th class="text-end">Haber</th>
                                        <th class="text-center">Estado</th>
                                        <th class="text-center">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="bodyAsientos">
                                    <!-- Contenido dinámico -->
                                </tbody>
                            </table>
                        </div>
                        
                        <!-- Paginación -->
                        <nav aria-label="Paginación" class="mt-3">
                            <div class="d-flex justify-content-between align-items-center">
                                <div class="text-muted">
                                    <small id="paginaInfo">Mostrando 0 de 0 asientos</small>
                                </div>
                                <ul class="pagination mb-0" id="paginacion">
                                    <!-- Contenido dinámico -->
                                </ul>
                            </div>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Scripts base -->
    <th:block th:replace="~{shared/layout :: scripts}"></th:block>
    
    <!-- Script específico -->
    <script th:src="@{/modules/contabilidad/js/asientos.js}"></script>
</body>
</html>
