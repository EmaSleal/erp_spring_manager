<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="es">
<head th:replace="~{shared/layout :: head}">
    <title>Cuentas por Pagar</title>
</head>
<body>

    <!-- Navbar -->
    <div th:replace="~{shared/components/navbar :: navbar}"></div>

    <!-- Sidebar -->
    <div th:replace="~{shared/components/sidebar :: sidebar}"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container-fluid py-4">

            <!-- Breadcrumb -->
            <div th:replace="~{shared/fragments/page-header :: breadcrumbNested('/contabilidad', 'fas fa-calculator', 'Contabilidad', 'fas fa-file-invoice-dollar', 'Cuentas por Pagar')}"></div>

            <!-- Page Header -->
            <div class="page-header mb-4">
                <div th:replace="~{shared/fragments/page-header :: pageHeaderContent('fas fa-file-invoice-dollar', 'text-warning', 'Gestión de', 'Cuentas por Pagar', 'Control y seguimiento de obligaciones con proveedores')}"></div>
                <div class="page-header-actions">
                    <a th:replace="~{shared/fragments/back-button :: backButton('/contabilidad', 'Volver a Contabilidad', 'Volver a Contabilidad')}"></a>
                </div>
            </div>

            <!-- Stat Cards -->
            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <div th:replace="~{shared/fragments/stat-card :: statCard(
                        'bg-warning',
                        'Saldo Pendiente',
                        '&#x20A1; ' + ${#numbers.formatDecimal(totalSaldoPendiente ?: 0, 1, 2)},
                        'fas fa-clock fa-3x',
                        'text-white-50')}"></div>
                </div>
                <div class="col-md-4">
                    <div th:replace="~{shared/fragments/stat-card :: statCard(
                        'bg-danger',
                        'Vencidas',
                        ${countVencidas ?: 0},
                        'fas fa-exclamation-triangle fa-3x',
                        'text-white-50')}"></div>
                </div>
                <div class="col-md-4">
                    <div th:replace="~{shared/fragments/stat-card :: statCard(
                        'bg-success',
                        'Total Pagado',
                        '&#x20A1; ' + ${#numbers.formatDecimal(totalPagado ?: 0, 1, 2)},
                        'fas fa-check-circle fa-3x',
                        'text-white-50')}"></div>
                </div>
            </div>

            <!-- Filter Card -->
            <div class="card shadow-sm border-0 mb-4">
                <div class="card-body">
                    <div class="row g-3 align-items-end">
                        <div class="col-md-4">
                            <label for="filtroEstado" class="form-label">Filtrar por Estado</label>
                            <select id="filtroEstado" class="form-select" onchange="filtrarPorEstado()">
                                <option value="">Todos</option>
                                <option th:each="estado : ${estados}"
                                        th:value="${estado.name()}"
                                        th:text="${estado.name()}"></option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <button type="button" class="btn btn-secondary w-100"
                                    onclick="document.getElementById('filtroEstado').value=''; filtrarPorEstado()">
                                <i class="fas fa-eraser me-1"></i>Limpiar
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Table Card -->
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0" id="tablaCuentas">
                            <thead>
                                <tr>
                                    <th>Número</th>
                                    <th>Proveedor</th>
                                    <th>Descripción</th>
                                    <th class="text-end">Monto</th>
                                    <th class="text-end">Saldo</th>
                                    <th class="text-center">Vencimiento</th>
                                    <th class="text-center">Estado</th>
                                    <th class="text-center">Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="cpp : ${cuentas}"
                                    th:attr="data-estado=${cpp.estado.name()}">
                                    <td>
                                        <div class="fw-bold text-primary" th:text="${cpp.numero}">CPP-2026-00001</div>
                                    </td>
                                    <td>
                                        <div class="fw-semibold" th:text="${cpp.proveedor.nombre}">Proveedor</div>
                                    </td>
                                    <td>
                                        <span th:text="${cpp.descripcion}">Descripción</span>
                                    </td>
                                    <td class="text-end">
                                        <span class="fw-bold"
                                              th:text="'₡ ' + ${#numbers.formatDecimal(cpp.monto, 1, 2)}">₡ 0.00</span>
                                    </td>
                                    <td class="text-end">
                                        <span th:classappend="${cpp.saldoPendiente.signum() > 0} ? 'text-danger' : 'text-success'"
                                              th:text="'₡ ' + ${#numbers.formatDecimal(cpp.saldoPendiente, 1, 2)}">₡ 0.00</span>
                                    </td>
                                    <td class="text-center">
                                        <span th:if="${cpp.fechaVencimiento != null}"
                                              th:text="${#temporals.format(cpp.fechaVencimiento, 'dd/MM/yyyy')}">01/01/2026</span>
                                        <span th:if="${cpp.fechaVencimiento == null}" class="text-muted">—</span>
                                    </td>
                                    <td class="text-center">
                                        <span th:if="${cpp.estado.name() == 'PENDIENTE'}"
                                              class="badge bg-warning text-dark">PENDIENTE</span>
                                        <span th:if="${cpp.estado.name() == 'PARCIAL'}"
                                              class="badge bg-info text-dark">PARCIAL</span>
                                        <span th:if="${cpp.estado.name() == 'PAGADA'}"
                                              class="badge bg-success">PAGADA</span>
                                        <span th:if="${cpp.estado.name() == 'VENCIDA'}"
                                              class="badge bg-danger">VENCIDA</span>
                                        <span th:if="${cpp.estado.name() == 'ANULADA'}"
                                              class="badge bg-dark">ANULADA</span>
                                    </td>
                                    <td class="text-center">
                                        <div class="btn-group" role="group">
                                            <button th:if="${cpp.estado.name() != 'PAGADA' and cpp.estado.name() != 'ANULADA'}"
                                                    class="btn btn-sm btn-outline-success btn-pagar"
                                                    th:attr="data-id=${cpp.id}, data-numero=${cpp.numero}, data-saldo=${cpp.saldoPendiente}"
                                                    onclick="abrirModalPago(this)"
                                                    title="Registrar Pago">
                                                <i class="fas fa-money-bill-wave"></i>
                                            </button>
                                            <button class="btn btn-sm btn-outline-secondary btn-historial"
                                                    th:attr="data-id=${cpp.id}, data-numero=${cpp.numero}"
                                                    onclick="abrirModalHistorial(this)"
                                                    title="Historial de Pagos">
                                                <i class="fas fa-history"></i>
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(cuentas)}"
                                    th:replace="~{shared/fragments/empty-state :: emptyStateRow(8, 'fas fa-file-invoice-dollar', 'No hay cuentas por pagar registradas')}"></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Modal: Register Payment -->
    <div class="modal fade" id="modalPago" tabindex="-1" aria-labelledby="modalPagoLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalPagoLabel">
                        <i class="fas fa-money-bill-wave me-2 text-success"></i>Registrar Pago
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <p class="mb-3">
                        CPP: <strong id="pagoNumeroCpp"></strong> &mdash;
                        Saldo: <strong id="pagoSaldoCpp" class="text-danger"></strong>
                    </p>
                    <form id="formPago" novalidate>
                        <input type="hidden" id="pagoCppId" />

                        <div class="mb-3">
                            <label for="pagoMonto" class="form-label">Monto <span class="text-danger">*</span></label>
                            <input type="number" id="pagoMonto" class="form-control"
                                   step="0.01" min="0.01" required
                                   placeholder="0.00" />
                        </div>

                        <div class="mb-3">
                            <label for="pagoMetodo" class="form-label">Método de Pago <span class="text-danger">*</span></label>
                            <select id="pagoMetodo" class="form-select" required>
                                <option value="">Seleccione...</option>
                                <option value="TRANSFERENCIA">TRANSFERENCIA</option>
                                <option value="CHEQUE">CHEQUE</option>
                                <option value="EFECTIVO">EFECTIVO</option>
                                <option value="SINPE">SINPE</option>
                                <option value="DEPOSITO">DEPOSITO</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="pagoReferencia" class="form-label">Referencia</label>
                            <input type="text" id="pagoReferencia" class="form-control"
                                   placeholder="Número de cheque, confirmación, etc." maxlength="100" />
                        </div>

                        <div class="mb-3">
                            <label for="pagoFecha" class="form-label">Fecha <span class="text-danger">*</span></label>
                            <input type="date" id="pagoFecha" class="form-control" required />
                        </div>

                        <div class="mb-3">
                            <label for="pagoNotas" class="form-label">Notas</label>
                            <textarea id="pagoNotas" class="form-control" rows="2"
                                      placeholder="Observaciones adicionales..." maxlength="1000"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-success" id="btnConfirmarPago" onclick="confirmarPago()">
                        <i class="fas fa-check me-1"></i>Confirmar Pago
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal: Payment History -->
    <div class="modal fade" id="modalHistorial" tabindex="-1" aria-labelledby="modalHistorialLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalHistorialLabel">
                        <i class="fas fa-history me-2 text-secondary"></i>Historial de Pagos
                        — <span id="historialNumeroCpp"></span>
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <div class="table-responsive">
                        <table class="table table-sm align-middle mb-0">
                            <thead>
                                <tr>
                                    <th>Número</th>
                                    <th>Fecha</th>
                                    <th class="text-end">Monto</th>
                                    <th class="text-center">Método</th>
                                    <th>Referencia</th>
                                    <th class="text-center">Estado</th>
                                </tr>
                            </thead>
                            <tbody id="historialBody">
                                <tr>
                                    <td colspan="6" class="text-center text-muted py-3">
                                        <i class="fas fa-spinner fa-spin me-1"></i>Cargando...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast container -->
    <div id="toastContainer" class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1100;"></div>

    <!-- Scripts base -->
    <th:block th:replace="~{shared/layout :: scripts}"></th:block>

    <script th:inline="javascript">
    /*<![CDATA[*/

    // ── Filtering ────────────────────────────────────────────────────────────
    function filtrarPorEstado() {
        const valor = document.getElementById('filtroEstado').value;
        const filas = document.querySelectorAll('#tablaCuentas tbody tr[data-estado]');
        filas.forEach(fila => {
            if (!valor || fila.dataset.estado === valor) {
                fila.style.display = '';
            } else {
                fila.style.display = 'none';
            }
        });
    }

    // ── Payment modal ────────────────────────────────────────────────────────
    function abrirModalPago(btn) {
        const id     = btn.dataset.id;
        const numero = btn.dataset.numero;
        const saldo  = parseFloat(btn.dataset.saldo);

        document.getElementById('pagoCppId').value          = id;
        document.getElementById('pagoNumeroCpp').textContent = numero;
        document.getElementById('pagoSaldoCpp').textContent  = '₡ ' + saldo.toFixed(2);
        document.getElementById('pagoMonto').value           = saldo.toFixed(2);
        document.getElementById('pagoMonto').max             = saldo;
        document.getElementById('pagoMetodo').value          = '';
        document.getElementById('pagoReferencia').value      = '';
        document.getElementById('pagoFecha').value           = new Date().toISOString().split('T')[0];
        document.getElementById('pagoNotas').value           = '';

        new bootstrap.Modal(document.getElementById('modalPago')).show();
    }

    async function confirmarPago() {
        const id       = document.getElementById('pagoCppId').value;
        const monto    = document.getElementById('pagoMonto').value;
        const metodo   = document.getElementById('pagoMetodo').value;
        const ref      = document.getElementById('pagoReferencia').value;
        const fecha    = document.getElementById('pagoFecha').value;
        const notas    = document.getElementById('pagoNotas').value;

        if (!monto || !metodo || !fecha) {
            mostrarToast('Por favor complete los campos requeridos.', 'warning');
            return;
        }

        const btn = document.getElementById('btnConfirmarPago');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i>Procesando...';

        try {
            const resp = await fetch(`/api/cuentas-pagar/${id}/pagar`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    [APP_CONFIG.csrf.header]: APP_CONFIG.csrf.token
                },
                body: JSON.stringify({
                    monto:      parseFloat(monto),
                    metodoPago: metodo,
                    referencia: ref || null,
                    fecha:      fecha,
                    notas:      notas || null
                })
            });

            if (resp.ok) {
                bootstrap.Modal.getInstance(document.getElementById('modalPago')).hide();
                mostrarToast('Pago registrado correctamente.', 'success');
                setTimeout(() => location.reload(), 1200);
            } else {
                const data = await resp.json().catch(() => ({}));
                mostrarToast(data.message || 'Error al registrar el pago.', 'danger');
            }
        } catch (e) {
            mostrarToast('Error de conexión. Intente nuevamente.', 'danger');
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-check me-1"></i>Confirmar Pago';
        }
    }

    // ── History modal ────────────────────────────────────────────────────────
    async function abrirModalHistorial(btn) {
        const id     = btn.dataset.id;
        const numero = btn.dataset.numero;

        document.getElementById('historialNumeroCpp').textContent = numero;
        document.getElementById('historialBody').innerHTML =
            '<tr><td colspan="6" class="text-center text-muted py-3"><i class="fas fa-spinner fa-spin me-1"></i>Cargando...</td></tr>';

        new bootstrap.Modal(document.getElementById('modalHistorial')).show();

        try {
            const resp = await fetch(`/api/cuentas-pagar/${id}/pagos`);
            const json = resp.ok ? await resp.json() : null;
            const pagos = json?.data ?? [];

            if (!pagos.length) {
                document.getElementById('historialBody').innerHTML =
                    '<tr><td colspan="6" class="text-center text-muted py-3">Sin pagos registrados.</td></tr>';
                return;
            }

            const rows = pagos.map(p => {
                const estadoBadge = p.estado === 'CONFIRMADO'
                    ? '<span class="badge bg-success">CONFIRMADO</span>'
                    : '<span class="badge bg-dark">ANULADO</span>';
                return `<tr>
                    <td class="fw-bold text-primary">${p.numero ?? '—'}</td>
                    <td>${p.fecha ?? '—'}</td>
                    <td class="text-end">₡ ${parseFloat(p.monto ?? 0).toFixed(2)}</td>
                    <td class="text-center"><span class="badge bg-secondary">${p.metodoPago ?? '—'}</span></td>
                    <td>${p.referencia ?? '—'}</td>
                    <td class="text-center">${estadoBadge}</td>
                </tr>`;
            }).join('');

            document.getElementById('historialBody').innerHTML = rows;
        } catch (e) {
            document.getElementById('historialBody').innerHTML =
                '<tr><td colspan="6" class="text-center text-danger py-3">Error al cargar historial.</td></tr>';
        }
    }

    // ── Toast helper ─────────────────────────────────────────────────────────
    function mostrarToast(mensaje, tipo) {
        const container = document.getElementById('toastContainer');
        const id = 'toast-' + Date.now();
        const colorClass = tipo === 'success' ? 'bg-success text-white'
                         : tipo === 'danger'  ? 'bg-danger text-white'
                         : tipo === 'warning' ? 'bg-warning text-dark'
                         : 'bg-info text-white';
        container.insertAdjacentHTML('beforeend', `
            <div id="${id}" class="toast align-items-center border-0 ${colorClass}" role="alert"
                 aria-live="assertive" aria-atomic="true">
                <div class="d-flex">
                    <div class="toast-body">${mensaje}</div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto"
                            data-bs-dismiss="toast" aria-label="Cerrar"></button>
                </div>
            </div>`);
        const toastEl = document.getElementById(id);
        const toast   = new bootstrap.Toast(toastEl, { delay: 4000 });
        toast.show();
        toastEl.addEventListener('hidden.bs.toast', () => toastEl.remove());
    }

    /*]]>*/
    </script>
</body>
</html>
