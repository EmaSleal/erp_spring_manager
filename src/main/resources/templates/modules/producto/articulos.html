<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="es">
<head th:replace="~{shared/layout :: head}">
    <title>Artículos Maestro</title>
</head>
<body>
    <!-- Navbar -->
    <div th:replace="~{shared/components/navbar :: navbar}"></div>

    <!-- Sidebar -->
    <div th:replace="~{shared/components/sidebar :: sidebar}"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container-fluid py-4">
            <!-- Breadcrumbs -->
            <div th:replace="~{shared/fragments/page-header :: breadcrumb('fas fa-boxes', 'Artículos Maestro')}"></div>

            <!-- Header -->
            <div class="page-header mb-4">
                <div th:replace="~{shared/fragments/page-header :: pageHeaderContent('fas fa-boxes', 'text-warning', 'Gestión de', 'Artículos Maestro', 'Administrá el catálogo de artículos y sus variantes')}"></div>
                <div class="page-header-actions">
                    <a th:replace="~{shared/fragments/back-button :: backButton('/dashboard', 'Volver', 'Volver al Dashboard')}"></a>
                    <a th:href="@{/articulos/nuevo}" class="btn btn-success"
                       sec:authorize="@permisoService.tienePermisoPorCodigo(#authentication.name, 'PRODUCTO_CREAR')"
                       data-bs-toggle="tooltip" data-bs-placement="bottom" title="Agregar nuevo artículo">
                        <i class="fas fa-plus"></i>
                        <span class="d-none d-sm-inline ms-2">Nuevo Artículo</span>
                    </a>
                </div>
            </div>

            <!-- Table Card -->
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <div class="responsive-table-container">

                        <!-- DESKTOP: Tabla tradicional -->
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead>
                                    <tr>
                                        <th>Descripción</th>
                                        <th class="text-center" style="width: 110px;">Estado</th>
                                        <th class="text-center" style="width: 110px;">Variantes</th>
                                        <th class="text-center" style="width: 160px;">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <th:block th:if="${#lists.isEmpty(maestros)}">
                                        <tr th:replace="~{shared/fragments/empty-state :: emptyStateRow(4, 'fas fa-inbox', 'No hay artículos registrados')}"></tr>
                                    </th:block>
                                    <tr th:each="maestro : ${maestros}">
                                        <td>
                                            <strong th:text="${maestro.descripcion}">Descripción</strong>
                                            <div class="text-muted small" th:if="${maestro.codigoCabys != null}">
                                                CABYS: <span th:text="${maestro.codigoCabys}"></span>
                                            </div>
                                        </td>
                                        <td class="text-center">
                                            <span class="badge"
                                                  th:classappend="${maestro.active} ? 'bg-success' : 'bg-secondary'"
                                                  th:text="${maestro.active} ? 'Activo' : 'Inactivo'">
                                                Activo
                                            </span>
                                        </td>
                                        <td class="text-center">
                                            <span class="badge bg-info text-dark"
                                                  th:text="${varianteCounts[maestro.idArticuloMaestro] ?: 0}">
                                                0
                                            </span>
                                        </td>
                                        <td class="text-center">
                                            <!-- Editar -->
                                            <a th:href="@{/articulos/{id}/editar(id=${maestro.idArticuloMaestro})}"
                                               class="btn btn-sm btn-warning me-1"
                                               data-bs-toggle="tooltip" title="Editar artículo">
                                                <i class="fas fa-edit"></i>
                                            </a>
                                            <!-- Desactivar / Reactivar -->
                                            <button type="button"
                                                    th:if="${maestro.active}"
                                                    th:data-id="${maestro.idArticuloMaestro}"
                                                    class="btn btn-sm btn-secondary btn-desactivar"
                                                    data-bs-toggle="tooltip" title="Desactivar">
                                                <i class="fas fa-ban"></i>
                                            </button>
                                            <button type="button"
                                                    th:unless="${maestro.active}"
                                                    th:data-id="${maestro.idArticuloMaestro}"
                                                    class="btn btn-sm btn-success btn-reactivar"
                                                    data-bs-toggle="tooltip" title="Reactivar">
                                                <i class="fas fa-check-circle"></i>
                                            </button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <!-- MÓVIL: Vista de tarjetas -->
                        <div class="mobile-card-view">
                            <th:block th:if="${#lists.isEmpty(maestros)}">
                                <div th:replace="~{shared/fragments/empty-state :: emptyStateCard('fas fa-inbox', 'No hay artículos registrados')}"></div>
                            </th:block>

                            <div th:each="maestro : ${maestros}" class="mobile-card card-warning">
                                <div class="mobile-card-header">
                                    <h6 class="mobile-card-title" th:text="${maestro.descripcion}">Descripción</h6>
                                    <span class="badge mobile-card-badge"
                                          th:classappend="${maestro.active} ? 'bg-success' : 'bg-secondary'"
                                          th:text="${maestro.active} ? 'Activo' : 'Inactivo'">
                                        Activo
                                    </span>
                                </div>
                                <div class="mobile-card-body">
                                    <div class="mobile-card-row" th:if="${maestro.codigoCabys != null}">
                                        <span class="mobile-card-label">CABYS</span>
                                        <span class="mobile-card-value" th:text="${maestro.codigoCabys}">-</span>
                                    </div>
                                    <div class="mobile-card-row">
                                        <span class="mobile-card-label">Variantes</span>
                                        <span class="mobile-card-value">
                                            <span class="badge bg-info text-dark"
                                                  th:text="${varianteCounts[maestro.idArticuloMaestro] ?: 0}">0</span>
                                        </span>
                                    </div>
                                </div>
                                <div class="mobile-card-footer mobile-card-actions">
                                    <a th:href="@{/articulos/{id}/editar(id=${maestro.idArticuloMaestro})}"
                                       class="btn btn-sm btn-warning">
                                        <i class="fas fa-edit me-1"></i>Editar
                                    </a>
                                    <button type="button"
                                            th:if="${maestro.active}"
                                            th:data-id="${maestro.idArticuloMaestro}"
                                            class="btn btn-sm btn-secondary btn-desactivar">
                                        <i class="fas fa-ban me-1"></i>Desactivar
                                    </button>
                                    <button type="button"
                                            th:unless="${maestro.active}"
                                            th:data-id="${maestro.idArticuloMaestro}"
                                            class="btn btn-sm btn-success btn-reactivar">
                                        <i class="fas fa-check-circle me-1"></i>Reactivar
                                    </button>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Scripts base -->
    <th:block th:replace="~{shared/layout :: scripts}"></th:block>

    <!-- CSRF token for fetch calls -->
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />

    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function () {
            const csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute('content');
            const csrfHeader = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');

            function cambiarEstado(id, accion) {
                if (!confirm('¿Confirmás la acción "' + accion + '" para este artículo?')) return;
                fetch('/api/articulos/' + id + '/' + accion, {
                    method: 'PATCH',
                    headers: { [csrfHeader]: csrfToken }
                })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        window.location.reload();
                    } else {
                        alert('Error: ' + data.message);
                    }
                })
                .catch(err => alert('Error de red: ' + err));
            }

            document.querySelectorAll('.btn-desactivar').forEach(btn => {
                btn.addEventListener('click', () => cambiarEstado(btn.dataset.id, 'desactivar'));
            });

            document.querySelectorAll('.btn-reactivar').forEach(btn => {
                btn.addEventListener('click', () => cambiarEstado(btn.dataset.id, 'reactivar'));
            });
        });
    </script>
</body>
</html>
