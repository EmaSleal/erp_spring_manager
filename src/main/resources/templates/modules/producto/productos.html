<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="es">
<head th:replace="~{shared/layout :: head}">
    <title>Productos</title>
</head>
<body>
    <!-- Navbar -->
    <div th:replace="~{shared/components/navbar :: navbar}"></div>

    <!-- Sidebar -->
    <div th:replace="~{shared/components/sidebar :: sidebar}"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container-fluid py-4">
            <!-- Breadcrumbs (oculto en móvil) -->
            <div th:replace="~{shared/fragments/page-header :: breadcrumb('fas fa-box', 'Productos')}"></div>

            <!-- Header Section -->
            <div class="page-header mb-4">
                <div th:replace="~{shared/fragments/page-header :: pageHeaderContent('fas fa-box', 'text-warning', 'Gestión de', 'Productos', 'Administra tu catálogo de productos')}"></div>
                <div class="page-header-actions">
                    <a th:replace="~{shared/fragments/back-button :: backButton('/dashboard', 'Volver a Dashboard', 'Volver al Dashboard')}"></a>
                    <button type="button" class="btn btn-success" onclick="openAddModal()"
                            sec:authorize="@permisoService.tienePermisoPorCodigo(#authentication.name, 'PRODUCTO_CREAR')"
                            data-bs-toggle="tooltip" data-bs-placement="bottom" title="Agregar nuevo producto">
                        <i class="fas fa-plus"></i>
                        <span class="d-none d-sm-inline ms-2">Agregar Producto</span>
                    </button>
                </div>
            </div>

            <!-- Search and Filter -->
            <div class="card shadow-sm border-0 mb-4">
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6">
                            <div th:replace="~{shared/fragments/search-bar :: searchBar('searchInput', 'Buscar por nombre, código o descripción...', 'filtrarProductos()')}"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Table Card -->
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    
                    <!-- ============================================
                         CONTENEDOR RESPONSIVE
                         ============================================ -->
                    <div class="responsive-table-container">
                        
                        <!-- DESKTOP: Tabla tradicional -->
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0 data-table">
                                <thead>
                                    <tr>
                                        <th class="text-center" style="width: 60px;">ID</th>
                                        <th class="d-none d-md-table-cell" style="width: 120px;">Código</th>
                                        <th>Descripción</th>
                                        <th class="text-end" style="width: 140px;">P. Institucional</th>
                                        <th class="text-end d-none d-lg-table-cell" style="width: 140px;">P. Mayorista</th>
                                        <th class="text-center d-none d-md-table-cell" style="width: 90px;">Estado</th>
                                        <th class="text-center">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="productosBody">
                                    <!-- Renderizado por JavaScript -->
                                </tbody>
                            </table>
                        </div>

                        <!-- MÓVIL: Vista de tarjetas -->
                        <div class="mobile-card-view" id="productosCards">
                            <!-- Tarjetas renderizadas por JavaScript -->
                        </div>

                    </div>
                    <!-- Fin contenedor responsive -->

                    <!-- Paginación -->
                    <div th:replace="~{shared/fragments/pagination :: pagination(${currentPage}, ${totalPages}, ${totalItems}, ${pageSize}, 'productos', '/productos', '&amp;size=' + ${pageSize} + '&amp;sortBy=' + ${sortBy} + '&amp;sortDir=' + ${sortDir})}"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal de Producto -->
    <div th:replace="~{modules/producto/form :: producto-modal}"></div>

    <!-- Scripts base -->
    <th:block th:replace="~{shared/layout :: scripts}"></th:block>
    
    <!-- JSON embebido para uso en JS -->
    <script th:inline="javascript">
        const productos = /*[[${productos}]]*/ [];
        // Permisos del usuario actual
        const permisos = {
            editar: /*[[${@permisoService.tienePermisoPorCodigo(#authentication.name, 'PRODUCTO_EDITAR')}]]*/ false,
            eliminar: /*[[${@permisoService.tienePermisoPorCodigo(#authentication.name, 'PRODUCTO_ELIMINAR')}]]*/ false
        };
    </script>
    
    <!-- JavaScript específico de página -->
    <script th:src="@{/modules/producto/js/productos.js}"></script>
    <script th:src="@{/modules/producto/js/cabys-utils.js}"></script>
</body>
</html>
