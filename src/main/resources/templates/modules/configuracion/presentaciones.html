<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="es">
<head th:replace="~{shared/layout :: head}">
    <title>Presentaciones</title>
</head>
<body>
    <div th:replace="~{shared/components/navbar :: navbar}"></div>
    <div th:replace="~{shared/components/sidebar :: sidebar}"></div>

    <main class="main-content">
        <div class="container-fluid py-4">
            <div th:replace="~{shared/fragments/page-header :: breadcrumbNested('/configuracion', 'fas fa-cog', 'Configuración', 'fas fa-box', 'Presentaciones')}"></div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="h3 mb-1"><i class="fas fa-box text-primary me-2"></i>Presentaciones</h1>
                    <p class="text-muted mb-0">
                        «Empacado»: la cantidad cuenta empaques y el XML usa la unidad «Unid».
                        Si no es empacado, el XML usa la unidad de medida indicada aquí.
                    </p>
                </div>
                <div>
                    <a th:href="@{/configuracion}" class="btn btn-outline-secondary me-2">
                        <i class="fas fa-arrow-left me-1"></i>Volver
                    </a>
                    <button type="button" class="btn btn-primary" id="btnNuevaPresentacion">
                        <i class="fas fa-plus me-1"></i>Nueva presentación
                    </button>
                </div>
            </div>

            <div id="presentacionesError" class="alert alert-danger" style="display:none" role="alert"></div>

            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0" id="tablaPresentaciones">
                            <thead>
                                <tr>
                                    <th>Nombre</th>
                                    <th class="text-center">Empacado</th>
                                    <th>Unidad FE</th>
                                    <th class="text-center" style="width: 120px;">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="presentacionesBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal crear/editar -->
    <div class="modal fade" id="presentacionModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="presentacionModalTitle">Nueva presentación</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <div id="presentacionModalError" class="alert alert-danger" style="display:none" role="alert"></div>
                    <input type="hidden" id="presentacionId">
                    <div class="mb-3">
                        <label for="presentacionNombre" class="form-label">Nombre *</label>
                        <input type="text" class="form-control" id="presentacionNombre" maxlength="100" required>
                    </div>
                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" id="presentacionEmpacado" checked>
                        <label class="form-check-label" for="presentacionEmpacado">Empacado</label>
                    </div>
                    <div class="mb-3" id="divUnidadFe" style="display:none">
                        <label for="presentacionUnidadFe" class="form-label">Unidad de medida (XML) *</label>
                        <select class="form-select" id="presentacionUnidadFe">
                            <option value="">Seleccione...</option>
                        </select>
                        <small class="text-muted">Solo aplica cuando no es empacado.</small>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="btnGuardarPresentacion">
                        <i class="fas fa-save me-1"></i>Guardar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <th:block th:replace="~{shared/layout :: scripts}"></th:block>
    <script th:src="@{/modules/configuracion/js/presentaciones.js}"></script>
</body>
</html>
