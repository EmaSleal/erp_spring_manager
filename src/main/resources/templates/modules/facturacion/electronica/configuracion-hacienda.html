<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="es">
<head th:replace="~{shared/layout :: head}">
    <title>Configuración Hacienda</title>
</head>
<body>
    <!-- CSS específico del módulo -->
    <link rel="stylesheet" th:href="@{/modules/facturacion/css/facturacion-electronica.css}">
    
    <!-- Navbar -->
    <div th:replace="~{shared/components/navbar :: navbar}"></div>

    <!-- Sidebar -->
    <div th:replace="~{shared/components/sidebar :: sidebar}"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container-fluid py-4">
            <!-- Breadcrumbs -->
            <div th:replace="~{shared/fragments/page-header :: breadcrumbNested('/facturas/comprobantes', 'fas fa-file-signature', 'Comprobantes', 'fas fa-cog', 'Configuración Hacienda')}"></div>

            <!-- Header Section -->
            <div class="page-header mb-4">
                <div th:replace="~{shared/fragments/page-header :: pageHeaderContent('fas fa-cog', 'text-warning', '', 'Configuración Hacienda', 'Gestiona las credenciales y configuración para Hacienda CR')}"></div>
                <div class="page-header-actions">
                    <a th:href="@{/facturas/comprobantes}" class="btn btn-outline-secondary"
                       data-bs-toggle="tooltip" data-bs-placement="bottom" title="Volver a Comprobantes">
                        <i class="fas fa-arrow-left"></i>
                        <span class="d-none d-md-inline ms-2">Volver</span>
                    </a>
                    <button type="button" class="btn btn-primary" onclick="nuevaConfiguracionModal()"
                            sec:authorize="@permisoService.tienePermisoPorCodigo(#authentication.name, 'FACTURA_EDITAR')"
                            data-bs-toggle="tooltip" data-bs-placement="bottom" title="Nueva configuración">
                        <i class="fas fa-plus"></i>
                        <span class="d-none d-sm-inline ms-2">Nueva Configuración</span>
                    </button>
                </div>
            </div>

            <!-- Configuración Activa -->
            <div class="card shadow-sm border-0 border-start border-success border-4 mb-4" id="configActiva">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <h5 class="card-title text-success">
                                <i class="fas fa-check-circle me-2"></i>Configuración Activa
                            </h5>
                            <p class="text-muted mb-0">Esta configuración se usa para generar comprobantes</p>
                        </div>
                        <span class="badge bg-success px-3 py-2">
                            <i class="fas fa-power-off me-1"></i>ACTIVA
                        </span>
                    </div>
                    <hr>
                    <div id="configActivaContent" class="row g-3">
                        <!-- Contenido dinámico -->
                    </div>
                </div>
            </div>

            <!-- Todas las Configuraciones -->
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <h5 class="card-title mb-3">
                        <i class="fas fa-list me-2"></i>Todas las Configuraciones
                    </h5>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Ambiente</th>
                                    <th>Usuario Hacienda</th>
                                    <th>Certificado</th>
                                    <th class="text-center">Estado Token</th>
                                    <th class="text-center">Estado</th>
                                    <th class="text-center">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="configuraciones-tbody">
                                <!-- Contenido dinámico -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal Nueva/Editar Configuración -->
    <div class="modal fade" id="configuracionModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-warning">
                    <h5 class="modal-title">
                        <i class="fas fa-cog me-2"></i>
                        <span id="modalTitle">Nueva Configuración</span>
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formConfiguracion">
                        <input type="hidden" id="configId">
                        
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="ambiente" class="form-label">Ambiente <span class="text-danger">*</span></label>
                                <select id="ambiente" class="form-select" required>
                                    <option value="">Seleccione...</option>
                                    <option value="SANDBOX">Sandbox (Pruebas)</option>
                                    <option value="PRODUCCION">Producción</option>
                                </select>
                            </div>
                            
                            <div class="col-md-6">
                                <label for="usuarioHacienda" class="form-label">Usuario Hacienda <span class="text-danger">*</span></label>
                                <input type="text" id="usuarioHacienda" class="form-control" required 
                                       placeholder="cpf-XX-XXXXX@stag.comprobanteselectronicos.go.cr">
                            </div>
                            
                            <div class="col-md-6">
                                <label for="passwordHacienda" class="form-label">Contraseña Hacienda <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <input type="password" id="passwordHacienda" class="form-control" required>
                                    <button class="btn btn-outline-secondary" type="button" onclick="togglePassword()">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                </div>
                            </div>
                            
                            <div class="col-md-6">
                                <label for="rutaCertificado" class="form-label">Certificado .p12 <span class="text-danger">*</span></label>
                                <div class="input-group mb-1">
                                    <input type="text" id="rutaCertificado" class="form-control" required
                                           placeholder="/app/certificados/empresa.p12">
                                    <label class="btn btn-outline-secondary mb-0" for="archivoCertificado" title="Subir archivo .p12">
                                        <i class="fas fa-upload"></i>
                                    </label>
                                    <input type="file" id="archivoCertificado" class="d-none" accept=".p12,.pfx"
                                           onchange="uploadCertificado(this)">
                                </div>
                                <small id="uploadCertStatus" class="text-muted">Ingresá la ruta o subí el archivo directamente</small>
                            </div>
                            
                            <div class="col-md-6">
                                <label for="pinCertificado" class="form-label">PIN del Certificado <span class="text-danger">*</span></label>
                                <input type="password" id="pinCertificado" class="form-control" required>
                            </div>
                            
                            <div class="col-12">
                                <hr>
                                <h6 class="text-muted">Consecutivos Iniciales</h6>
                            </div>
                            
                            <div class="col-md-3">
                                <label for="consecutivoFactura" class="form-label">Factura</label>
                                <input type="number" id="consecutivoFactura" class="form-control" 
                                       value="1" min="1">
                            </div>
                            
                            <div class="col-md-3">
                                <label for="consecutivoTiquete" class="form-label">Tiquete</label>
                                <input type="number" id="consecutivoTiquete" class="form-control" 
                                       value="1" min="1">
                            </div>
                            
                            <div class="col-md-3">
                                <label for="consecutivoNotaCredito" class="form-label">N. Crédito</label>
                                <input type="number" id="consecutivoNotaCredito" class="form-control" 
                                       value="1" min="1">
                            </div>
                            
                            <div class="col-md-3">
                                <label for="consecutivoNotaDebito" class="form-label">N. Débito</label>
                                <input type="number" id="consecutivoNotaDebito" class="form-control" 
                                       value="1" min="1">
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="fas fa-times me-1"></i>Cancelar
                    </button>
                    <button type="button" class="btn btn-primary" onclick="guardarConfiguracion()">
                        <i class="fas fa-save me-1"></i>Guardar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts de Bootstrap y librerías -->
    <div th:replace="~{shared/layout :: scripts}"></div>

    <!-- Scripts personalizados -->
    <script th:inline="javascript">
        const EMPRESA_ID = /*[[${empresaId ?: 1}]]*/ 1;
        const csrfToken = /*[[${_csrf.token}]]*/ '';
        const csrfHeader = /*[[${_csrf.headerName}]]*/ '';
        let configuraciones = [];
        let configActual = null;

        // Cargar configuraciones
        function cargarConfiguraciones() {
            fetch(`/api/facturas/configuracion-hacienda/empresa/${EMPRESA_ID}`)
                .then(res => res.json())
                .then(data => {
                    configuraciones = data;
                    renderizarConfiguraciones(data);
                    
                    // Buscar configuración activa
                    const activa = data.find(c => c.activa);
                    if (activa) {
                        mostrarConfigActiva(activa);
                    } else {
                        document.getElementById('configActivaContent').innerHTML = 
                            '<div class="alert alert-warning mb-0">No hay configuración activa. Cree una nueva o active una existente.</div>';
                    }
                })
                .catch(err => {
                    console.error('Error cargando configuraciones:', err);
                    mostrarAlerta('Error cargando configuraciones', 'danger');
                });
        }

        function mostrarConfigActiva(config) {
            const content = document.getElementById('configActivaContent');
            content.innerHTML = `
                <div class="col-md-4">
                    <strong class="text-muted d-block mb-1">Ambiente</strong>
                    <span class="badge ${config.ambiente === 'PRODUCCION' ? 'bg-danger' : 'bg-info'} px-3 py-2">
                        ${config.ambiente}
                    </span>
                </div>
                <div class="col-md-4">
                    <strong class="text-muted d-block mb-1">Usuario Hacienda</strong>
                    <span>${config.usuarioHacienda}</span>
                </div>
                <div class="col-md-4">
                    <strong class="text-muted d-block mb-1">Estado Token</strong>
                    ${config.tokenValido ? 
                        '<span class="badge bg-success px-3 py-2"><i class="fas fa-check me-1"></i>Válido</span>' : 
                        '<span class="badge bg-warning text-dark px-3 py-2"><i class="fas fa-exclamation-triangle me-1"></i>Renovar</span>'
                    }
                </div>
                <div class="col-md-12 mt-3">
                    <div class="d-flex gap-2">
                        <button class="btn btn-sm btn-warning" onclick="renovarToken(${config.id})">
                            <i class="fas fa-sync me-1"></i>Renovar Token
                        </button>
                        <button class="btn btn-sm btn-info" onclick="verConsecutivos(${config.id})">
                            <i class="fas fa-hashtag me-1"></i>Ver Consecutivos
                        </button>
                        <button class="btn btn-sm btn-primary" onclick="editarConfiguracion(${config.id})">
                            <i class="fas fa-edit me-1"></i>Editar
                        </button>
                    </div>
                </div>
            `;
        }

        function renderizarConfiguraciones(data) {
            const tbody = document.getElementById('configuraciones-tbody');
            if (!data || data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4">No hay configuraciones registradas</td></tr>';
                return;
            }

            tbody.innerHTML = data.map(config => `
                <tr class="${config.activa ? 'table-success' : ''}">
                    <td>${config.id}</td>
                    <td>
                        <span class="badge ${config.ambiente === 'PRODUCCION' ? 'bg-danger' : 'bg-info'}">
                            ${config.ambiente}
                        </span>
                    </td>
                    <td>${config.usuarioHacienda}</td>
                    <td>
                        <small class="text-muted">${config.rutaCertificado || 'No configurado'}</small>
                    </td>
                    <td class="text-center">
                        ${config.tokenValido ? 
                            '<span class="badge bg-success"><i class="fas fa-check"></i></span>' : 
                            '<span class="badge bg-warning"><i class="fas fa-exclamation-triangle"></i></span>'
                        }
                    </td>
                    <td class="text-center">
                        ${config.activa ? 
                            '<span class="badge bg-success">Activa</span>' : 
                            '<span class="badge bg-secondary">Inactiva</span>'
                        }
                    </td>
                    <td class="text-center">
                        <div class="btn-group btn-group-sm" role="group">
                            ${!config.activa ? `
                                <button onclick="activarConfig(${config.id})" class="btn btn-success btn-sm" title="Activar">
                                    <i class="fas fa-power-off"></i>
                                </button>
                            ` : ''}
                            <button onclick="editarConfiguracion(${config.id})" class="btn btn-primary btn-sm" title="Editar">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button onclick="eliminarConfig(${config.id})" class="btn btn-danger btn-sm" title="Eliminar">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        // Acciones
        function nuevaConfiguracionModal() {
            document.getElementById('formConfiguracion').reset();
            document.getElementById('configId').value = '';
            document.getElementById('modalTitle').textContent = 'Nueva Configuración';
            new bootstrap.Modal(document.getElementById('configuracionModal')).show();
        }

        function editarConfiguracion(id) {
            const config = configuraciones.find(c => c.id === id);
            if (!config) return;

            document.getElementById('configId').value = config.id;
            document.getElementById('ambiente').value = config.ambiente;
            document.getElementById('usuarioHacienda').value = config.usuarioHacienda;
            document.getElementById('rutaCertificado').value = config.rutaCertificado || '';
            document.getElementById('consecutivoFactura').value = config.consecutivoFactura || 1;
            document.getElementById('consecutivoTiquete').value = config.consecutivoTiquete || 1;
            document.getElementById('consecutivoNotaCredito').value = config.consecutivoNotaCredito || 1;
            document.getElementById('consecutivoNotaDebito').value = config.consecutivoNotaDebito || 1;
            
            document.getElementById('modalTitle').textContent = 'Editar Configuración';
            new bootstrap.Modal(document.getElementById('configuracionModal')).show();
        }

        async function uploadCertificado(input) {
            const file = input.files[0];
            if (!file) return;
            const status = document.getElementById('uploadCertStatus');
            status.textContent = 'Subiendo...';
            status.className = 'text-muted';
            const formData = new FormData();
            formData.append('archivo', file);
            const headers = {};
            if (csrfToken && csrfHeader) headers[csrfHeader] = csrfToken;
            try {
                const res = await fetch('/api/facturas/configuracion-hacienda/upload-certificado', {
                    method: 'POST',
                    headers: headers,
                    body: formData
                });
                const data = await res.json();
                if (!res.ok) {
                    status.textContent = data.error || 'Error al subir el archivo';
                    status.className = 'text-danger';
                    return;
                }
                document.getElementById('rutaCertificado').value = data.ruta;
                status.textContent = 'Archivo subido: ' + file.name;
                status.className = 'text-success';
            } catch (e) {
                status.textContent = 'Error de conexión al subir el archivo';
                status.className = 'text-danger';
            }
            input.value = '';
        }

        function guardarConfiguracion() {
            const form = document.getElementById('formConfiguracion');
            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            const id = document.getElementById('configId').value;
            const data = {
                empresaId: EMPRESA_ID,
                ambiente: document.getElementById('ambiente').value,
                usuarioHacienda: document.getElementById('usuarioHacienda').value,
                passwordHacienda: document.getElementById('passwordHacienda').value,
                rutaCertificado: document.getElementById('rutaCertificado').value,
                pinCertificado: document.getElementById('pinCertificado').value,
                consecutivoFactura: parseInt(document.getElementById('consecutivoFactura').value) || 1,
                consecutivoTiquete: parseInt(document.getElementById('consecutivoTiquete').value) || 1,
                consecutivoNotaCredito: parseInt(document.getElementById('consecutivoNotaCredito').value) || 1,
                consecutivoNotaDebito: parseInt(document.getElementById('consecutivoNotaDebito').value) || 1,
                activa: false
            };

            const url = id ? `/api/facturas/configuracion-hacienda/${id}` : '/api/facturas/configuracion-hacienda';
            const method = id ? 'PUT' : 'POST';

            const headers = {
                'Content-Type': 'application/json'
            };
            
            if (csrfToken && csrfHeader) {
                headers[csrfHeader] = csrfToken;
            }

            fetch(url, {
                method: method,
                headers: headers,
                body: JSON.stringify(data)
            })
            .then(res => {
                if (!res.ok) {
                    throw new Error(`HTTP ${res.status}: ${res.statusText}`);
                }
                return res.json();
            })
            .then(result => {
                mostrarAlerta(id ? 'Configuración actualizada' : 'Configuración creada', 'success');
                bootstrap.Modal.getInstance(document.getElementById('configuracionModal')).hide();
                cargarConfiguraciones();
            })
            .catch(err => {
                console.error('Error guardando configuración:', err);
                mostrarAlerta('Error guardando configuración: ' + err.message, 'danger');
            });
        }

        function activarConfig(id) {
            if (!confirm('¿Activar esta configuración? La configuración actual se desactivará.')) return;

            const headers = {};
            if (csrfToken && csrfHeader) {
                headers[csrfHeader] = csrfToken;
            }

            fetch(`/api/facturas/configuracion-hacienda/${id}/activar`, { 
                method: 'PUT',
                headers: headers
            })
                .then(res => res.json())
                .then(result => {
                    mostrarAlerta('Configuración activada', 'success');
                    cargarConfiguraciones();
                })
                .catch(err => {
                    console.error(err);
                    mostrarAlerta('Error activando configuración', 'danger');
                });
        }

        function eliminarConfig(id) {
            if (!confirm('¿Eliminar esta configuración?')) return;

            const headers = {};
            if (csrfToken && csrfHeader) {
                headers[csrfHeader] = csrfToken;
            }

            fetch(`/api/facturas/configuracion-hacienda/${id}`, { 
                method: 'DELETE',
                headers: headers
            })
                .then(() => {
                    mostrarAlerta('Configuración eliminada', 'success');
                    cargarConfiguraciones();
                })
                .catch(err => {
                    console.error(err);
                    mostrarAlerta('Error eliminando configuración', 'danger');
                });
        }

        function renovarToken(id) {
            const headers = {};
            if (csrfToken && csrfHeader) {
                headers[csrfHeader] = csrfToken;
            }

            fetch(`/api/facturas/configuracion-hacienda/${id}/renovar-token`, { 
                method: 'POST',
                headers: headers
            })
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        mostrarAlerta('Token renovado exitosamente', 'success');
                        cargarConfiguraciones();
                    } else {
                        mostrarAlerta(data.message || 'Error renovando token', 'danger');
                    }
                })
                .catch(err => {
                    console.error(err);
                    mostrarAlerta('Error renovando token', 'danger');
                });
        }

        function verConsecutivos(id) {
            fetch(`/api/facturas/configuracion-hacienda/${id}/consecutivos`)
                .then(res => res.json())
                .then(data => {
                    alert(`Consecutivos actuales:\n\n` +
                          `Factura: ${data.facturaElectronica}\n` +
                          `Tiquete: ${data.tiqueteElectronico}\n` +
                          `Nota Crédito: ${data.notaCredito}\n` +
                          `Nota Débito: ${data.notaDebito}`);
                })
                .catch(err => console.error(err));
        }

        function togglePassword() {
            const input = document.getElementById('passwordHacienda');
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        /**
         * Mostrar notificación con SweetAlert2 Toast
         * @param {string} mensaje - Mensaje a mostrar
         * @param {string} tipo - 'success', 'danger', 'warning', 'info'
         */
        function mostrarAlerta(mensaje, tipo) {
            // Mapear tipos Bootstrap a tipos SweetAlert2
            const tipoMap = {
                'success': 'success',
                'danger': 'error',
                'warning': 'warning',
                'info': 'info'
            };
            
            const Toast = Swal.mixin({
                toast: true,
                position: 'top-end',
                showConfirmButton: false,
                timer: 3000,
                timerProgressBar: true,
                didOpen: (toast) => {
                    toast.addEventListener('mouseenter', Swal.stopTimer);
                    toast.addEventListener('mouseleave', Swal.resumeTimer);
                }
            });

            Toast.fire({
                icon: tipoMap[tipo] || 'info',
                title: mensaje
            });
        }

        // Inicialización
        document.addEventListener('DOMContentLoaded', () => {
            cargarConfiguraciones();
        });
    </script>
</body>
</html>
