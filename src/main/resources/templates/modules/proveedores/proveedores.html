<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{shared/layout :: head}">
    <title>Proveedores</title>
</head>
<body>
<div th:replace="~{shared/components/navbar :: navbar}"></div>
<div th:replace="~{shared/components/sidebar :: sidebar}"></div>

<main class="main-content">
    <div class="container-fluid py-4">

        <div th:replace="~{shared/fragments/page-header :: breadcrumb('fas fa-truck', 'Proveedores')}"></div>

        <div class="row mb-3">
            <div class="col">
                <div th:replace="~{shared/fragments/page-header :: pageHeaderContent('fas fa-truck', 'text-primary', 'Gestión de', 'Proveedores', 'Registro y administración de proveedores')}"></div>
            </div>
            <div class="col-auto d-flex align-items-end gap-2">
                <a href="/proveedores/nuevo"
                   class="btn btn-primary"
                   sec:authorize="@permisoService.tienePermiso(authentication, 'PROVEEDOR_CREAR')">
                    <i class="fas fa-plus me-1"></i>Nuevo Proveedor
                </a>
            </div>
        </div>

        <!-- Search -->
        <div class="row mb-3">
            <div class="col-md-4">
                <input type="text" id="searchInput" class="form-control" placeholder="Buscar por nombre o cédula...">
            </div>
            <div class="col-md-3">
                <select id="filtroTipo" class="form-select">
                    <option value="">Todos los tipos</option>
                    <option th:each="t : ${tiposProveedor}" th:value="${t}" th:text="${t}"></option>
                </select>
            </div>
            <div class="col-md-2">
                <select id="filtroActivo" class="form-select">
                    <option value="">Todos</option>
                    <option value="true">Activos</option>
                    <option value="false">Inactivos</option>
                </select>
            </div>
        </div>

        <!-- Table -->
        <div class="card shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0" id="tablaProveedores">
                        <thead class="table-light">
                            <tr>
                                <th>Cédula</th>
                                <th>Nombre</th>
                                <th>Tipo</th>
                                <th>Categoría</th>
                                <th>Teléfono</th>
                                <th>Email</th>
                                <th>Saldo Pendiente</th>
                                <th>Estado</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="p : ${proveedores}"
                                th:data-tipo="${p.tipoProveedor}"
                                th:data-activo="${p.activo}">
                                <td th:text="${p.cedula}"></td>
                                <td>
                                    <div class="fw-semibold" th:text="${p.nombre}"></div>
                                    <small class="text-muted" th:if="${p.nombreComercial}" th:text="${p.nombreComercial}"></small>
                                </td>
                                <td>
                                    <span class="badge bg-info" th:text="${p.tipoProveedor}"></span>
                                </td>
                                <td>
                                    <span class="badge bg-secondary" th:if="${p.categoria}" th:text="${p.categoria}"></span>
                                </td>
                                <td th:text="${p.telefono}"></td>
                                <td th:text="${p.email}"></td>
                                <td class="text-end">
                                    <span th:if="${p.saldoPendiente != null and p.saldoPendiente.compareTo(T(java.math.BigDecimal).ZERO) > 0}"
                                          class="text-danger fw-bold"
                                          th:text="${'₡ ' + #numbers.formatDecimal(p.saldoPendiente, 1, 'COMMA', 2, 'POINT')}">
                                    </span>
                                    <span th:unless="${p.saldoPendiente != null and p.saldoPendiente.compareTo(T(java.math.BigDecimal).ZERO) > 0}"
                                          class="text-muted">—</span>
                                </td>
                                <td>
                                    <span th:if="${p.activo}" class="badge bg-success">Activo</span>
                                    <span th:unless="${p.activo}" class="badge bg-secondary">Inactivo</span>
                                </td>
                                <td class="text-center">
                                    <div class="btn-group btn-group-sm">
                                        <a th:href="@{/proveedores/{id}/editar(id=${p.id})}"
                                           class="btn btn-outline-primary"
                                           title="Editar"
                                           sec:authorize="@permisoService.tienePermiso(authentication, 'PROVEEDOR_EDITAR')">
                                            <i class="fas fa-edit"></i>
                                        </a>
                                        <button th:if="${p.activo}"
                                                class="btn btn-outline-danger btn-desactivar"
                                                th:data-id="${p.id}"
                                                th:data-nombre="${p.nombre}"
                                                title="Desactivar"
                                                sec:authorize="@permisoService.tienePermiso(authentication, 'PROVEEDOR_ELIMINAR')">
                                            <i class="fas fa-ban"></i>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    <div th:replace="~{shared/fragments/empty-state :: emptyState('fas fa-truck', 'No hay proveedores registrados')}"
                         th:if="${#lists.isEmpty(proveedores)}">
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<script>
document.getElementById('searchInput').addEventListener('input', filtrar);
document.getElementById('filtroTipo').addEventListener('change', filtrar);
document.getElementById('filtroActivo').addEventListener('change', filtrar);

function filtrar() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    const tipo = document.getElementById('filtroTipo').value;
    const activo = document.getElementById('filtroActivo').value;

    document.querySelectorAll('#tablaProveedores tbody tr').forEach(tr => {
        const texto = tr.innerText.toLowerCase();
        const matchQ = !q || texto.includes(q);
        const matchTipo = !tipo || tr.dataset.tipo === tipo;
        const matchActivo = !activo || tr.dataset.activo === activo;
        tr.style.display = (matchQ && matchTipo && matchActivo) ? '' : 'none';
    });
}

document.querySelectorAll('.btn-desactivar').forEach(btn => {
    btn.addEventListener('click', async () => {
        const id = btn.dataset.id;
        const nombre = btn.dataset.nombre;
        if (!confirm(`¿Desactivar proveedor "${nombre}"?`)) return;
        const res = await fetch(`/api/proveedores/${id}`, { method: 'DELETE' });
        const data = await res.json();
        if (data.success) location.reload();
        else alert(data.message);
    });
});
</script>

<div th:replace="~{shared/layout :: scripts}"></div>
</body>
</html>
