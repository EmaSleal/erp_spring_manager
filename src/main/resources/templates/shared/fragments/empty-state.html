<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>

<!-- Table row empty state — use inside <tbody> -->
<tr th:fragment="emptyStateRow(colspan, icon, message)">
    <td th:attr="colspan=${colspan}" class="text-center text-muted py-4">
        <i th:class="${icon} + ' fa-3x mb-3 d-block'"></i>
        <span th:text="${message}"></span>
    </td>
</tr>

<!-- Card/div empty state — use outside tables -->
<div th:fragment="emptyStateCard(icon, message)" class="text-center text-muted py-5">
    <i th:class="${icon} + ' fa-3x mb-3 d-block'"></i>
    <p th:text="${message}" class="mb-0"></p>
</div>

</body>
</html>
